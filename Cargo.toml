[package]
name = "nexuterm"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Terminal y gestor de conexiones remotas para Linux"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:vte4", "dep:libc", "dep:adw", "dep:secret", "dep:syntect"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"], optional = true }
vte4 = { version = "0.10", optional = true }
libc = { version = "0.2", optional = true }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"], optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"], optional = true }
secret = { package = "libsecret", version = "0.9", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "sync", "time", "io-util", "macros", "fs"] }
openssh-sftp-client = "0.15.10"
sha2 = "0.10"
zeroize = "1"
futures-util = "0.3"
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "cliprdr", "displaycontrol", "dvc"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
x509-cert = "0.2"
smallvec = "1"
anyhow = "1"
tempfile = "3"
bytes = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "nexuterm"
path = "src/main.rs"
required-features = ["gui"]

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
